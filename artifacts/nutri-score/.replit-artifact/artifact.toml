kind = "web"
previewPath = "/"
title = "Nutri-Score Calculator"
version = "1.0.0"
id = "artifacts/nutri-score"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19674

[services.development]
run = "pnpm --filter @workspace/nutri-score run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutri-score", "run", "build" ]
publicDir = "artifacts/nutri-score/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19674"
BASE_PATH = "/"
